services:
  db:
    image: postgres:16-alpine
    container_name: secadm_db
    environment:
      POSTGRES_USER: secadm
      POSTGRES_PASSWORD: secadm_password
      POSTGRES_DB: secadm
    ports:
      - "5432:5432"
    volumes:
      - secadm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secadm -d secadm"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./api
    container_name: secadm_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://secadm:secadm_password@db:5432/secadm?schema=public
      COOKIE_NAME: secadm_session
      COOKIE_SECRET: "troque_isto_por_um_segredo_longo_32+chars"
      CORS_ORIGIN: "http://localhost:5173"
      SESSION_TTL_HOURS: 12
    ports:
      - "3000:3000"

volumes:
  secadm_pgdata:
